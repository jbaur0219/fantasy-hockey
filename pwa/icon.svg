<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#1F6BFF"/><stop offset=".55" stop-color="#1235C9"/><stop offset="1" stop-color="#0B0F5C"/></linearGradient>
 <radialGradient id="spot" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#7FD8FF" stop-opacity=".75"/><stop offset="1" stop-color="#7FD8FF" stop-opacity="0"/></radialGradient>
 <!-- puck face, top-down -->
 <radialGradient id="face" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#4A4A4F"/><stop offset=".5" stop-color="#1A1A1C"/><stop offset="1" stop-color="#000"/></radialGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9F7FF"/><stop offset=".4" stop-color="#5FB8FF" stop-opacity=".4"/><stop offset="1" stop-color="#9BD7FF"/></linearGradient>
 <linearGradient id="ar" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2FD27A"/><stop offset="1" stop-color="#B6FFCF"/></linearGradient>
 <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#3a3a40"/><stop offset=".55" stop-color="#16161a"/><stop offset="1" stop-color="#000"/></linearGradient>
 <filter id="ds" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="36" stdDeviation="36" flood-color="#020630" flood-opacity=".7"/></filter>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/><rect width="1024" height="1024" fill="url(#spot)"/>
<!-- motion streaks -->
<g stroke="#fff" stroke-linecap="round" fill="none">
 <path d="M90 760 L 300 650" stroke-opacity=".35" stroke-width="22"/><path d="M60 640 L 230 552" stroke-opacity=".22" stroke-width="16"/><path d="M170 860 L 340 772" stroke-opacity=".18" stroke-width="14"/>
</g>
<g filter="url(#ds)">
 <circle cx="530" cy="526" r="330" fill="#050506"/>
 <path d="M200 490 A330 330 0 0 0 860 490 L 860 526 A330 330 0 0 1 200 526 Z" fill="url(#edge)"/>
 <circle cx="530" cy="490" r="330" fill="url(#face)"/>
</g>
<circle cx="530" cy="490" r="330" fill="none" stroke="url(#rim)" stroke-width="14"/>
<circle cx="530" cy="490" r="268" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="6"/>
<!-- specular sweep -->
<path d="M260 380 A 300 300 0 0 1 700 220 A 330 330 0 0 0 250 470 Z" fill="url(#spec)"/>
<!-- bold rising arrow -->
<g filter="url(#glow)" stroke="url(#ar)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M330 650 L 460 515 L 545 595 L 712 405"/>
 <path d="M590 400 L 716 396 L 712 522"/>
</g>
</svg>
