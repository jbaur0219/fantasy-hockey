name: Daily fantasy hockey report
run-name: Daily fantasy hockey report (${{ github.event.inputs.reason || github.event_name }})

on:
  workflow_dispatch:         # started by the Watcher (watch.yml) at the right times, by the Refresh button, or by hand         # also lets you press a "Run workflow" button any time
    inputs:
      reason:
        description: "Why this run was started (the checker fills this in)"
        required: false
        default: "manual"
      mode:
        description: "live = build and publish; preview = build only and save it to the branch for review"
        required: false
        default: "live"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event.inputs.mode == 'preview' && 'preview' || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Let final stats settle after the last game
        if: startsWith(github.event.inputs.reason, 'post-game')
        run: sleep 600
      - name: Use the live locked plan (preview builds only)
        if: github.event.inputs.mode == 'preview'
        run: git fetch --depth=1 origin main && git show origin/main:plan_state.json > plan_state.json || true
      - name: Interactive site with deeper stats
        run: python build.py
        env:
          FH_RECORD: snapshot.json.gz
          ESPN_S2: ${{ secrets.ESPN_2 }}
          SWID: ${{ secrets.SWID }}
      - name: Save the preview to the branch
        if: github.event.inputs.mode == 'preview'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- plan_state.json || true
          rm -rf preview && mkdir preview && cp -r site/. preview/ && cp snapshot.json.gz preview/
          git add preview
          git commit -m "Preview build" && git push origin HEAD:${{ github.ref_name }}
      - name: Save the weekly plan and the saved Daily Faceoff data
        if: github.event.inputs.mode != 'preview'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in plan_state.json cache history; do [ -e "$f" ] && git add "$f" || true; done
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly plan and saved Daily Faceoff data"
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi
      - name: Keep the alert text for the alert job
        if: startsWith(github.event.inputs.reason, 'morning')
        uses: actions/upload-artifact@v4
        with:
          name: alert
          path: notify_payload.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            site/
            snapshot.json.gz
      - uses: actions/upload-pages-artifact@v3
        if: github.event.inputs.mode != 'preview'
        with:
          path: site/

  deploy:
    needs: build
    if: github.event.inputs.mode != 'preview'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    # Sends the morning push only after the new build is live, so tapping it always shows fresh data.
    needs: deploy
    if: startsWith(github.event.inputs.reason, 'morning')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: alert
      - run: pip install pywebpush
      - run: python notify.py
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
