name: Daily fantasy hockey report
run-name: Daily fantasy hockey report (${{ github.event.inputs.reason || github.event_name }})

on:
  schedule:
    - cron: "11 12 * * *"   # about 7:11 AM Eastern, a daily safety net; refresh.yml starts the game-time rebuilds
  workflow_dispatch:         # also lets you press a "Run workflow" button any time
    inputs:
      reason:
        description: "Why this run was started (the checker fills this in)"
        required: false
        default: "manual"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Let final stats settle after the last game
        if: startsWith(github.event.inputs.reason, 'post-game')
        run: sleep 600
      - name: Interactive site with deeper stats
        run: python build.py
        env:
          ESPN_S2: ${{ secrets.ESPN_2 }}
          SWID: ${{ secrets.SWID }}
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
