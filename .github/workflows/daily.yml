name: Daily fantasy hockey report
run-name: Daily fantasy hockey report (${{ github.event.inputs.reason || github.event_name }})

on:
  schedule:
    - cron: "11 12 * * *"   # about 7:11 AM Eastern, a daily safety net; refresh.yml starts the game-time rebuilds
  workflow_dispatch:         # also lets you press a "Run workflow" button any time
    inputs:
      reason:
        description: "Why this run was started (the checker fills this in)"
        required: false
        default: "manual"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Let final stats settle after the last game
        if: startsWith(github.event.inputs.reason, 'post-game')
        run: sleep 600
      - name: Interactive site with deeper stats
        run: python build.py
        env:
          ESPN_S2: ${{ secrets.ESPN_2 }}
          SWID: ${{ secrets.SWID }}
      - name: Save the locked weekly plan
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan_state.json
          git diff --cached --quiet || (git commit -m "Update locked weekly plan" && git push)
      - name: Keep the alert text for the alert job
        if: startsWith(github.event.inputs.reason, 'morning')
        uses: actions/upload-artifact@v4
        with:
          name: alert
          path: notify_payload.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    # Sends the morning push only after the new build is live, so tapping it always shows fresh data.
    needs: deploy
    if: startsWith(github.event.inputs.reason, 'morning')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: alert
      - run: pip install pywebpush
      - run: python notify.py
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
