name: Daily fantasy hockey report

on:
  schedule:
    - cron: "0 12 * * *"   # 7:00 AM Eastern (winter)
    - cron: "0 17 * * *"   # noon Eastern, after goalie news settles
  workflow_dispatch:        # also lets you press a "Run workflow" button any time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Interactive site with deeper stats
        run: python build.py
        env:
          ESPN_S2: ${{ secrets.ESPN_2 }}
          SWID: ${{ secrets.SWID }}
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
