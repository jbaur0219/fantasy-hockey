name: Smart refresh check
run-name: Smart refresh check

# Manual check only. The automatic checks now run inside the Watcher workflow (watch.yml), because GitHub only ran
# this file's 15-minute timer a few times a day. Pressing "Run workflow" here does a dry run by default.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would happen"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: smart-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to rebuild
        run: python3 scheduler.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
